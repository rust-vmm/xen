[package]
authors = ["Mathieu Poirier <mathieu.poirier@linaro.org"]
description = "Xen syctcl ioctl call implementation"
repository = "https://gitlab.com/cardoe/oxerun.git"
license = "Apache-2.0 OR MIT"
name = "xen-ioctls"
readme = "README.md"
version = "0.1.0"
edition = "2018"

[dependencies]
libc = ">=0.2.95"
vmm-sys-util = ">=0.9.0"
xen-bindings = { path = "../xen-bindings" }
cfg-if = { version = "1.0.0" }

[features]
default = []
"xen_domctl_interface_version_0x15" = []
"xen_domctl_interface_version_0x16" = []
"xen_domctl_interface_version_0x17" = []
"xen_domctl_interface_version_0x18" = []

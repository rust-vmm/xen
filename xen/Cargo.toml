[package]
authors = ["Doug Goldstein <cardoe@cardoe.com>"]
description = "Idomatic Rust interfaces to Xen hypercall APIs"
categories = ["external-ffi-bindings"]
homepage = "https://github.com/rust-vmm/xen-sys"
repository = "https://github.com/rust-vmm/xen-sys.git"
license = "Apache-2.0 OR MIT"
name = "xen"
readme = "README.md"
version = "0.1.0"
edition = "2018"

[dependencies]
volatile = { version = "0.6.1", features = ["derive", "unstable"] }
xen-sys = { path = "../xen-sys" }

[dependencies.nix]
version = "0.30.1"
features = ["ioctl", "mman"]
optional = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_vendor, values("xen"))'] }
